name: Build Ghanima APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -o GhanimaAndroid_Project.zip -d project
          find project -type f

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          find project -name gradlew -type f
          echo "Checking project files"
          find project -maxdepth 5 -type f

      - name: Build status
        run: echo "Project files checked"
